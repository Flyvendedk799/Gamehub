<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- PlayerZero "Slot Zero" mark (identity board, direction A): a sharp square
       with a signal-cyan hairline frame holding a lone 0 — empty by design.
       The 0 is drawn as geometry (not text) so it renders identically without
       webfonts at favicon sizes. -->
  <rect width="64" height="64" fill="#0d0e10"/>
  <rect x="2" y="2" width="60" height="60" fill="none" stroke="#46e6f0" stroke-width="4"/>
  <ellipse cx="32" cy="32" rx="10.5" ry="14.5" fill="none" stroke="#f2f4f5" stroke-width="6"/>
</svg>
